version: "3.8"

services:
  postgres:
    container_name: "recodations-postgres"
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=recodations
    volumes:
      - "./volume/pgdata:/var/lib/postgresql/data"

  floci-gcp:
    container_name: "recodations-floci-gcp"
    image: floci/floci-gcp:latest
    restart: always
    ports:
      - "4588:4588"
    environment:
      - FLOCI_STORAGE_MODE=memory
      - GOOGLE_CLOUD_PROJECT=floci-local
    volumes:
      - "./volume/floci:/var/lib/floci"

  redis:
    container_name: "recodations-redis"
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "./volume/redis:/data"

  api:
    container_name: "recodations-api"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=recodations
      - DB_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - GOOGLE_CLOUD_PROJECT=floci-local
      - STORAGE_EMULATOR_HOST=http://floci-gcp:4588
      - GCS_BUCKET_NAME=photos
      - JWT_SECRET=super-secret-jwt-token-key-32-bytes!
      - SNOWFLAKE_NODE_ID=1
    depends_on:
      - postgres
      - floci-gcp
      - redis
